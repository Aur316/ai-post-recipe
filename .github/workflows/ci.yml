name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: recipe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d recipe"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/recipe
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/${{ matrix.app }}.Dockerfile -t ai-post-recipe-${{ matrix.app }} .
